<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0c11">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0c11'/%3E%3Cpath d='M16 4l3 9h9l-7 5 3 9-8-6-8 6 3-9-7-5h9z' fill='%237cc4d6'/%3E%3C/svg%3E">
<title>Tales from the Skald</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Uncial+Antiqua&family=VT323&display=swap">
<style>
/* Layout: one-screen game. HUD strip on top, square pixel viewport, touch controls below.
   Look: frost-lit stone, bone type, blood and rune-cyan as the only strong colours. Single dark theme by design. */
:root{
  color-scheme:dark;
  --bg:#0a0c11;
  --panel:#121723;
  --line:#2a3246;
  --bone:#e7dec6;
  --dim:#8b93a7;
  --blood:#b8352c;
  --blood-deep:#4a1a1d;
  --rune:#7cc4d6;
  --ember:#e08a2e;
  --gold:#e3b84a;
  --font-display:'Uncial Antiqua','Palatino Linotype',Georgia,serif;
  --font-ui:'VT323','Courier New',monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--bone);
  font-family:var(--font-ui);font-size:18px;line-height:1.15;
  padding-block:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;
}
#app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--rune);outline-offset:2px}

/* HUD */
#hud{display:grid;gap:5px}
.hrow{display:flex;align-items:center;gap:12px;font-size:19px;letter-spacing:.08em;text-transform:uppercase}
.hrow .sp{flex:1}
.chip{color:var(--dim);white-space:nowrap}
.chip b{color:var(--bone);font-weight:400}
.chip.gold b{color:var(--gold)}
.tiny{background:none;border:1px solid var(--line);padding:1px 8px;font-size:16px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);touch-action:manipulation}
.bars{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:8px}
.bar{position:relative;height:18px;background:#0d1118;border:1px solid var(--line);overflow:hidden}
.bar i{position:absolute;inset:0;transform-origin:left center;transform:scaleX(var(--v,1));background:var(--blood)}
.bar.mp i{background:#3f8aa0}
.bar b{position:relative;display:block;text-align:center;font-weight:400;font-size:16px;line-height:16px;color:#fff;text-shadow:0 1px 0 #000}
.bar.xp{height:4px;border:0}
.bar.xp i{background:var(--gold)}

/* Viewport */
#stage{position:relative;flex:1 1 0;min-height:0;display:grid;place-items:center}
#view{position:relative;flex:none}
#cv{display:block;width:100%;height:100%;background:#07080c;border:2px solid var(--line);image-rendering:pixelated;image-rendering:crisp-edges}
#mini{position:absolute;top:8px;right:8px;width:68px;height:68px;background:rgba(7,8,12,.55);border:1px solid var(--line);image-rendering:pixelated;pointer-events:none;opacity:.9}
#saga{position:absolute;left:2px;right:2px;bottom:2px;padding:22px 12px 9px;text-align:center;font-family:var(--font-display);font-size:12px;line-height:1.45;color:var(--bone);background:linear-gradient(rgba(7,8,12,0),rgba(7,8,12,.88));pointer-events:none;opacity:0;text-wrap:balance}
#saga.on{animation:saga 5.5s forwards}
@keyframes saga{0%{opacity:0;transform:translateY(4px)}8%{opacity:1;transform:none}82%{opacity:1}100%{opacity:0}}
#banner{position:absolute;left:0;right:0;top:34%;text-align:center;font-family:var(--font-display);font-size:30px;letter-spacing:.14em;text-transform:uppercase;color:var(--bone);text-shadow:0 2px 0 #000,0 0 18px rgba(124,196,214,.35);pointer-events:none;opacity:0}
#banner.on{animation:banner 2.4s forwards}
@keyframes banner{0%{opacity:0;letter-spacing:.3em}20%{opacity:1;letter-spacing:.14em}75%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){#saga.on,#banner.on{animation-duration:.01s;animation-fill-mode:forwards}#saga.on,#banner.on{opacity:1}}

/* Overlays */
#ov{position:absolute;inset:0;display:none;overflow:auto;background:rgba(7,8,12,.94);padding:14px;touch-action:pan-y;z-index:5}
#ov.show{display:block}
.pane{max-width:440px;min-height:100%;margin:0 auto;display:flex;flex-direction:column;justify-content:center;gap:14px;text-align:center}
.eyebrow{font-size:18px;letter-spacing:.3em;text-transform:uppercase;color:var(--ember)}
h1,h2{margin:0;font-family:var(--font-display);font-weight:400;text-wrap:balance}
h1{font-size:clamp(30px,10vw,46px);line-height:1.05}
h2{font-size:clamp(22px,7vw,30px);line-height:1.1}
.sub{margin:0;font-size:24px;letter-spacing:.2em;text-transform:uppercase;color:var(--rune)}
.lede{margin:0;font-size:21px;color:var(--bone);max-width:34ch;margin-inline:auto;text-wrap:balance}
.how{margin:0;padding:0;list-style:none;display:grid;gap:4px;font-size:18px;color:var(--dim);text-align:left;max-width:34ch;margin-inline:auto}
.how b{color:var(--bone);font-weight:400}
.pane.ttl.hs .how{display:none}
.keys{margin:0;font-size:16px;line-height:1.4;color:var(--dim);max-width:46ch;margin-inline:auto;text-align:left}
.keys summary{cursor:pointer;color:var(--ember);text-align:center;letter-spacing:.12em;text-transform:uppercase;font-size:15px;padding:4px}
.keys p{margin:6px 0 0}
.keys b{color:var(--bone);font-weight:400}
.cta small{display:block;font-size:.55em;letter-spacing:.03em;text-transform:none;opacity:.85;margin-top:4px;font-family:inherit}
.pf{outline:2px solid var(--ember)!important;outline-offset:2px;box-shadow:0 0 14px rgba(224,160,70,.55)!important}
@media (pointer:fine){#cv{cursor:crosshair}}
.cta{align-self:center;background:var(--blood);color:#fff;border:0;padding:12px 20px;font-size:22px;letter-spacing:.1em;text-transform:uppercase;touch-action:manipulation}
.cta:active{filter:brightness(1.25)}
.ghost{align-self:center;background:none;border:1px solid var(--line);padding:9px 16px;font-size:19px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);touch-action:manipulation}
.best{margin:0;font-size:18px;color:var(--dim);min-height:1em}
.seg2{display:grid;gap:4px;justify-items:center}
.sgl{font-size:16px;letter-spacing:.24em;text-transform:uppercase;color:var(--dim)}
.seg{display:flex;gap:0;max-width:100%}
.sg{background:none;border:1px solid var(--line);padding:7px 14px;font-size:20px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);touch-action:manipulation;margin-left:-1px}
.sg.on{background:var(--blood-deep);border-color:var(--blood);color:var(--bone);position:relative}
.sgd{margin:0;font-size:18px;color:var(--dim);max-width:36ch;margin-inline:auto;text-wrap:balance;min-height:2.3em}
.tl,.tr{display:flex;flex-direction:column;gap:14px;min-width:0}
@media (orientation:landscape) and (max-height:560px){
  #ov{padding:8px 14px}
  .pane.ttl{flex-direction:row;align-items:center;max-width:840px;gap:26px}
  .pane.ttl .tl,.pane.ttl .tr{flex:1 1 0;gap:7px}
  .pane.ttl h1{font-size:34px}
  .pane.ttl .eyebrow{font-size:15px}
  .pane.ttl .sub{font-size:19px}
  .pane.ttl .how{font-size:16px;gap:3px}
  .pane.ttl .sg{padding:5px 9px;font-size:17px}
  .pane.ttl .sgl{font-size:13px}
  .pane.ttl .sgd{font-size:14px;min-height:2.7em}
  .pane.ttl .cta{padding:9px 16px;font-size:19px}
  .pane.ttl .ghost.sm{padding:5px 10px;font-size:15px}
  .pane.ttl .best{font-size:15px}
}
.cards{display:grid;gap:8px}
.card{display:grid;gap:3px;text-align:left;background:var(--panel);border:1px solid var(--line);padding:10px 12px;width:100%;touch-action:manipulation}
.card:hover,.card:active{border-color:var(--ember)}
.card .tag{font-size:16px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.card .tag.new{color:var(--ember)}
.card .tag.up{color:var(--rune)}
.card .nm{font-family:var(--font-display);font-size:16px;line-height:1.25}
.card .ds{font-size:19px;color:var(--dim)}
.card .mt{font-size:17px;color:var(--rune)}
.shop{display:grid;gap:8px}
.item{display:flex;align-items:center;gap:10px;text-align:left;background:var(--panel);border:1px solid var(--line);padding:9px 12px;width:100%;touch-action:manipulation}
.item .tx{flex:1;min-width:0;display:grid;gap:2px}
.item .nm{font-family:var(--font-display);font-size:14px}
.item .ds{font-size:18px;color:var(--dim)}
.item .pr{font-size:22px;color:var(--gold);white-space:nowrap}
.item[disabled]{opacity:.4}
.purse{margin:0;font-size:22px;color:var(--gold)}
.stats{margin:0;font-size:21px;color:var(--bone);display:flex;justify-content:center;gap:16px;flex-wrap:wrap}

/* Controls */
#controls{flex:none;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:12px;align-items:center;height:clamp(150px,25vh,200px)}
#stickWrap{display:grid;place-items:center;height:100%}
#stick{position:relative;height:min(100%,170px);aspect-ratio:1;border-radius:50%;border:2px solid var(--line);background:radial-gradient(circle,#171d2a 0,#0d1118 72%);touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:46%;aspect-ratio:1;margin:-23% 0 0 -23%;border-radius:50%;background:#2a3550;border:2px solid #4d5d86;pointer-events:none}
#btns{height:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:6px;grid-template-areas:"s0 s1 s2" "atk atk dash" "atk atk pots"}
#sk0{grid-area:s0}#sk1{grid-area:s1}#sk2{grid-area:s2}
#bAtk{grid-area:atk;background:var(--blood-deep);border-color:var(--blood);font-size:28px;letter-spacing:.1em;text-transform:uppercase}
#bDash{grid-area:dash}
#pots{grid-area:pots;display:grid;grid-template-columns:1fr 1fr;gap:6px;min-height:0}
.b{position:relative;overflow:hidden;min-width:0;min-height:0;padding:0;border:2px solid #3a4560;background:#151b28;display:grid;place-items:center;text-align:center;line-height:1;font-size:17px;touch-action:none}
.b.on{filter:brightness(1.45)}
.b.dis{opacity:.5}
.b .cdv{position:absolute;left:0;right:0;bottom:0;height:calc(var(--cd,0)*100%);background:rgba(0,0,0,.62);pointer-events:none}
.b .k{position:absolute;left:4px;top:2px;font-size:13px;color:var(--dim)}
.b .mc{position:absolute;right:4px;bottom:2px;font-size:13px;color:var(--rune)}
.b .nm{padding:0 2px}
.b.empty .nm{color:#4c556b;font-size:14px}
#pots .b{font-size:15px}
#hint{display:none;font-size:15px;color:var(--dim);text-align:center;letter-spacing:.04em}
@media (hover:hover) and (pointer:fine){#hint{display:block}}

/* Translucent controls, bigger minimap, tool column, landscape */
#mini{width:96px;height:96px;pointer-events:auto;cursor:pointer;opacity:.88;touch-action:manipulation;z-index:2}
#tools{position:absolute;right:8px;top:112px;z-index:2;display:flex;flex-direction:column;gap:4px}
#tools .tiny{min-width:66px;padding:3px 8px;background:rgba(7,8,12,.5);border-color:rgba(60,72,100,.7);color:var(--bone)}
#bView{position:absolute;right:8px;top:122px;width:96px;z-index:2;padding:3px 6px;text-align:center;background:rgba(7,8,12,.5);border-color:rgba(60,72,100,.7);color:var(--bone)}
.land #bView{top:126px;width:112px}
#controls{opacity:.62}
#stick{background:radial-gradient(circle,rgba(23,29,42,.5) 0,rgba(13,17,24,.32) 72%);border-color:rgba(90,104,140,.55)}
#knob{background:rgba(70,88,130,.6);border-color:rgba(120,140,190,.7)}
.b{background:rgba(21,27,40,.45);border-color:rgba(90,104,140,.6)}
#bAtk{background:rgba(110,31,34,.5);border-color:rgba(184,53,44,.75)}
.b .cdv{background:rgba(0,0,0,.5)}
#bigmap{width:min(100%,60vh,440px);height:auto;aspect-ratio:1;align-self:center;image-rendering:pixelated;border:1px solid var(--line);background:#07080c}
.legend{display:flex;gap:14px;justify-content:center;margin:0;font-size:18px}
.lg::before{content:"";display:inline-block;width:10px;height:10px;margin-right:6px;background:currentColor}
.lg.c{color:#8fe3ff}.lg.p{color:#c8a8ff}
#mini{border:2px solid #6a5634;border-radius:3px;box-shadow:0 0 0 1px #07080c,0 3px 10px rgba(0,0,0,.65);background:#06080d;opacity:.96}
.lg.w{color:#fff}.lg.r{color:#d9473b}.lg.y{color:var(--gold)}
.land #hud{position:absolute;left:0;top:0;z-index:3;width:min(46%,300px);padding:6px 8px;background:rgba(7,8,12,.4);border:1px solid rgba(42,50,70,.6);pointer-events:none}
.land #stage{position:absolute;inset:0;display:block}
.land #view{position:absolute;left:0;top:0}
.land #mini{width:112px;height:112px}
.land #tools{top:128px}
.land #controls{position:absolute;left:0;right:0;bottom:0;height:auto;z-index:3;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none;opacity:.55}
.land #stickWrap{height:auto}
.land #stick{width:min(36vh,150px);height:auto;pointer-events:auto}
.land #btns{width:min(46vw,250px);height:min(36vh,150px);pointer-events:auto}
.land #hint{display:none}
.land .pane{gap:8px}
#controls{grid-template-columns:minmax(0,.85fr) minmax(0,1.25fr)}
#btns{grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(6,minmax(0,1fr));grid-template-areas:"s0 s1 s2 ph" "s0 s1 s2 ph" "atk atk dash ph" "atk atk dash pm" "atk atk dash pm" "atk atk dash pm"}
#pots{display:contents}
#pHp{grid-area:ph}#pMp{grid-area:pm}
#pots .b{font-size:14px}
#sk0,#sk1,#sk2,#bDash{font-size:15px}
.land #btns{width:min(54vw,310px)}
.land #tools{top:8px;right:128px;flex-direction:row}
.land #tools .tiny{min-width:0}
.land #controls{justify-content:flex-end}
.port #hud{width:calc(100% - 136px)}
.port .hrow{font-size:15px;gap:2px 8px;flex-wrap:wrap;letter-spacing:.04em}
.port #tools{top:158px;right:8px;flex-direction:column}
.port #tools .tiny{min-width:66px}
#dstick{position:fixed;left:0;top:0;width:116px;height:116px;margin:-58px 0 0 -58px;border-radius:50%;border:2px solid rgba(140,160,210,.55);background:radial-gradient(circle,rgba(40,52,80,.35) 0,rgba(13,17,24,.18) 70%);opacity:0;pointer-events:none;z-index:6;transition:opacity .12s}
#dknob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(90,110,160,.55);border:2px solid rgba(160,180,230,.7)}

/* v12: compact translucent round buttons, free placement (see layoutBtns) */
#app #controls{position:fixed;left:0;top:0;right:0;bottom:0;height:auto;display:block;padding:0;pointer-events:none;opacity:var(--bop,.75);z-index:3}
#app #btns{position:absolute;inset:0;width:auto;height:auto;display:block;pointer-events:none;--u:46px}
#app #pots{display:contents}
#app .b{position:absolute;left:0;top:0;width:var(--u);height:var(--u);transform:translate(-50%,-50%);border-radius:50%;pointer-events:auto;font-size:13px;letter-spacing:0;background:rgba(18,24,38,.34);border:1.5px solid rgba(120,138,184,.55);touch-action:none;-webkit-tap-highlight-color:transparent}
#app #bAtk{width:calc(var(--u)*1.45);height:calc(var(--u)*1.45);background:rgba(120,34,38,.36);border-color:rgba(200,64,54,.7);font-size:17px;letter-spacing:.04em}
#app #pHp,#app #pMp{width:calc(var(--u)*.88);height:calc(var(--u)*.88);font-size:12px}
#app #sk0,#app #sk1,#app #sk2,#app #bDash{font-size:12px}
#app #sk0 .nm,#app #sk1 .nm,#app #sk2 .nm{transform:translateY(-4px);letter-spacing:-.02em}
#app .b .nm{padding:0 1px;line-height:.95}
#app .b .k{left:50%;top:2px;transform:translateX(-50%);font-size:11px}
#app .b .mc{left:0;right:0;bottom:2px;text-align:center;font-size:11px}
#app .b .cdv{background:rgba(0,0,0,.5)}
#app .b.on{filter:brightness(1.6)}
#app .b.empty .nm{font-size:11px}
#app .b.empty{opacity:.55}
#app.editing .b.empty{opacity:1}
@media (pointer:coarse){#app .b .k{display:none}}
#app.editing .b{outline:2px dashed #9fe3f5;outline-offset:3px;cursor:grab}
#app.editing .b.on{filter:none;outline-style:solid;cursor:grabbing}
#bedit{position:fixed;left:50%;top:8px;transform:translateX(-50%);z-index:7;display:none;gap:4px 12px;align-items:center;justify-content:center;flex-wrap:wrap;width:min(94vw,560px);padding:6px 12px;background:rgba(10,12,18,.94);border:1px solid var(--line);font-size:16px;letter-spacing:.03em}
#app.editing #bedit{display:flex}
#bedit .bt{flex:1 1 100%;text-align:center;color:var(--bone);font-family:var(--font-display);font-size:14px;letter-spacing:.08em}
#bedit .bt small{font-family:var(--font-ui);font-size:16px;color:var(--dim);letter-spacing:.03em}
#bedit label{display:flex;flex-direction:column;align-items:stretch;gap:0;color:var(--dim);flex:1 1 150px;min-width:0}
#bedit label span{white-space:nowrap;line-height:1}
#bedit input[type=range]{width:100%;min-width:0;margin:0;height:26px;accent-color:#7cc4d6;touch-action:none}
#bedit button{background:none;border:1px solid var(--line);color:var(--dim);padding:4px 14px;font-size:17px;letter-spacing:.08em;text-transform:uppercase;touch-action:manipulation}
#bedit button.go{background:var(--blood);border-color:var(--blood);color:#fff}

/* Inventory */
.inv{max-width:580px;text-align:left;gap:8px}
.invh{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.invh h2{font-size:24px}
.sum{margin:0;display:flex;flex-wrap:wrap;gap:2px 14px;font-size:18px;color:var(--dim)}
.sum b{color:var(--bone);font-weight:400}
.invg{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
@media (orientation:landscape){.invg{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}}
.invl,.invr{min-width:0}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;margin-bottom:8px}
.gs,.gb{background:var(--panel);border:1px solid var(--rc,var(--line));color:var(--bone);padding:5px;min-height:46px;display:grid;align-content:center;gap:1px;text-align:center;touch-action:manipulation;min-width:0}
.gs .gl{font-size:14px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase}
.gs .gn,.gb span{font-size:15px;line-height:1.05;overflow-wrap:break-word;color:var(--rc,var(--bone))}
.gs.empty{border-style:dashed;border-color:var(--line)}
.gs.empty .gn{color:#4c556b}
.gs.sel,.gb.sel{outline:2px solid var(--rune);outline-offset:1px}
.bag{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}
.gx{border:1px dashed #1f2638;background:transparent}
.gd{display:grid;gap:3px;background:var(--panel);border:1px solid var(--line);padding:10px;min-width:0}
.gnm{font-family:var(--font-display);font-size:16px;line-height:1.25}
.grt{font-size:16px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase}
.gst{font-size:20px;color:#9ee0a8}
.gst.neg{color:#ff8a7a}
.gds{font-size:18px;color:var(--dim)}
.gact{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.cta.sm,.ghost.sm{font-size:18px;padding:8px 12px}
.ghost[disabled]{opacity:.4}

/* Diablo-style paper doll and grid backpack */
.d2{--cs:34px}
@media (orientation:portrait){.d2{--cs:min(38px,calc((100vw - 56px)/8))}}
@media (orientation:landscape){.d2{--cs:min(34px,calc((100vw - 230px)/14))}}
.inv.d2{max-width:780px}
.d2 .invg{grid-template-columns:minmax(0,1fr);justify-items:center;gap:12px}
@media (orientation:landscape){.d2 .invg{grid-template-columns:auto auto minmax(150px,1fr);justify-items:stretch;align-items:start}}

function bladeGeom(o){
  const N=46,L=[],R=[],S=[];
  for(let i=0;i<=N;i++){
    const t=i/N,tip=(a,b)=>t<a?1:Math.pow(Math.max(0,1-(t-a)/(1-a)),b);
    const side=ph=>{
      switch(o.type){
        case 'broad':return o.hw*(1-.1*t)*tip(.8,.85);
        case 'leaf':return o.hw*(1+.24*Math.sin(Math.PI*Math.min(1,t*1.12)))*(1-.08*t)*tip(.72,.8);
        case 'flame':return o.hw*(.92+.2*Math.sin(t*20+ph))*(1-.05*t)*tip(.7,.8);
        case 'ice':return o.hw*(1-.25*Math.floor(t*6)/6)*(1+.14*(((i+ph|0)%3)-1))*tip(.8,.7);
        case 'dark':return o.hw*(.78+.38*Math.sin(Math.PI*Math.min(1,t*.95+.12)))*tip(.75,.85);
        case 'dag':return o.hw*(1-.55*t)*tip(.9,.9);
        case 'kris':return o.hw*(.85+.25*Math.sin(t*16+ph))*(1-.5*t)*tip(.85,.9);
        default:return o.hw*(1-.12*t)*tip(.82,.9);
      }
    };
    const x=o.cx+(o.curve||0)*t*t,y=o.yb-t*o.len;
    S.push([x,y]);L.push([x-side(0),y]);R.push([x+side(2.4|0),y]);
  }
  return{L,R,S};
}

  if(o.glow){c.save();c.shadowColor=o.glow;c.shadowBlur=16;body();c.fillStyle=o.glow;c.fill();c.restore()}
  body();c.fillStyle=drk(base,.35);c.fill();
  const xl=g.L[0][0],xr=g.R[0][0],cx=g.S[0][0];
  const half=(A,fill)=>{trace(A);for(let i=g.S.length-1;i>=0;i--)c.lineTo(g.S[i][0],g.S[i][1]);c.closePath();c.fillStyle=fill;c.fill()};

const TREE_CACHE={};
function treeSpr(kind,v){

  };

      const y1=by-8-t*9.5,hw=15.5-t*2.7,hh=12.5,col=['#1d4a2a','#245832','#2b663a','#32743f','#3a8248'][t];

      x.fillStyle=cmix(col,.25);x.beginPath();x.moveTo(bx,y1-hh);x.lineTo(bx-hw*.9,y1-1);x.lineTo(bx-hw*.4,y1-3);x.lineTo(bx-.5,y1-hh*.6);x.closePath();x.fill();
      x.fillStyle=cmix(col,-.28);x.beginPath();x.moveTo(bx+1,y1-hh*.8);x.lineTo(bx+hw*.9,y1-1);x.lineTo(bx+hw*.45,y1-3);x.closePath();x.fill();
      for(let i=0;i<8;i++){x.fillStyle=cmix(col,i%2?.45:-.45);x.fillRect(bx-hw*.8+R(i,t+5)*hw*1.6,y1-hh*.8+R(t,i+7)*hh*.8,1,1)}
    }
  }else{
    const birch=kind==='birch',apple=kind==='apple';
    if(birch){trunk(2.2,22,'#efeade','#9a968a');x.fillStyle='#2a2826';for(let i=0;i<7;i++)x.fillRect(bx-2+R(i,1)*3,by-3-i*3,1+R(i,2)*2,1)}
    else trunk(3.1,17,'#74502f','#43301c','#2e2012');
    const cy=by-(birch?34:30),n=birch?11:15,rad=birch?7.5:9.5,spread=birch?10:14;
    const base=birch?['#4f8f3c','#6aa84a','#8cc860','#b6e07c']:apple?['#2f5f2a','#437e36','#5b9a46','#7cb860']:['#24491f','#37692c','#4d8a3a','#6fae52'];
    const cl=[];for(let i=0;i<n;i++){const a=i/n*6.283+R(i,9)*.6,d=(.35+.65*R(i,10))*spread;cl.push([bx+Math.cos(a)*d*1.18,cy+Math.sin(a)*d*.78-(i%3)*1.2,rad*(.72+.5*R(i,11))])}
    cl.push([bx,cy-3,rad*1.2]);cl.push([bx-4,cy-1,rad]);cl.push([bx+4,cy+1,rad]);

    for(const [cx,cyy,r] of cl){x.fillStyle=base[1];x.beginPath();x.arc(cx,cyy,r,0,6.283);x.fill()}

/* ================= VILLAGE: people ================= */
function humanRows(o){
  const W=18,pad=s=>{const n=W-s.length;if(n<0||n%2)throw new Error('pad '+s.length+':'+s);return'.'.repeat(n/2)+s+'.'.repeat(n/2)};
  const hat=o.hat||'hair',sd=hat==='hood'||hat==='kerchief'?'H':hat==='bald'?'s':'a';
  let top;
  if(hat==='hair')top=['aaaaaa','aaaAaaaa','aaaaaaaaaa'];
  else if(hat==='cap')top=['HHHHHH','HHhhHHHH','JJJJJJJJJJJJ'];
  else if(hat==='hood')top=['HHHHHH','HHhHHHHH','HHHHHHHHHH'];
  else if(hat==='kerchief')top=['HHHHHH','HHhHHHHH','HhHHHHHHhH'];
  else if(hat==='helm')top=['HHHHHH','HhhHHHHH','JJJJJJJJJJJJ'];
  else if(hat==='band')top=['aaaaaa','aaaAaaaa','YYYYYYYYYY'];
  else if(hat==='pointy')top=['HH','HhHH','HhHHHH','HHhHHHHH','HHHhHHHHHH','JJJJJJJJJJJJ'];
  else top=['ssssss','ssssssss','ssssssssss'];
  const bd=o.beard||'none',F=[];
  F.push(sd+'ssssssss'+sd);
  F.push(sd+'sesssses'+sd);
  if(bd==='full'||bd==='long'){F.push(sd+'qssssssq'+sd);F.push('qqqsSSsqqq');F.push('qqQqqQqq');F.push(bd==='long'?'qqQqqq':'qQqq')}
  else if(bd==='short'){F.push(sd+'ssssssss'+sd);F.push('ssqqqqqqss');F.push('ssqSSqss'.length===8?'ssqSSqss':'ssssssss');F.push('SSSS')}
  else{F.push(sd+'ssssssss'+sd);F.push('ssssSSssss');F.push('ssssssss');F.push('SSSS')}
  const T=['UUTTTTTTTTUU','UUUTTTTTTTTUUU','UUUTTTttTTTUUU','sUUTTTttTTTUUs','ssUXXXYYXXXUss','.ssTTTTTTTTss.','...TTTTTTTT...','...TTTttTTT...'];
  const Lg=o.robe?['..TTTTTTTTTT..','..TTTTttTTTT..','.TTTTTttTTTTT.','.TTTTTttTTTTT.','TTTTTTttTTTTTT','TTTTTTttTTTTTT','tTTTTTttTTTTTt','ttBBttttttBBtt']
    :['...PPPPPPPP...','...PPPppPPP...','...PPP..PPP...','...PPP..PPP...','...PPP..PPP...','...pPP..PPp...','..BBBB..BBBB..','..BBBB..BBBB..'];
  let body=T.concat(Lg);
  if(o.kid){body=body.filter((_,i)=>i!==6&&i!==10&&i!==11)}
  const rows=top.concat(F,body).map(r=>pad(r).split(''));
  const hr=top.length+F.length;
  const put=(r,c,ch)=>{if(r>=0&&r<rows.length&&c>=0&&c<W)rows[r][c]=ch};
  const fill=(r,c0,c1,ch)=>{for(let c=c0;c<=c1;c++)put(r,c,ch)};
  const bs=hr;
  if(bd==='long'){fill(bs,7,10,'q');put(bs,8,'Q');fill(bs+1,8,9,'q')}
  if(o.apron){const ch=o.apron;for(let r=bs+2;r<=bs+7;r++)fill(r,6,11,r===bs+4?'X':ch);if(!o.robe)for(let r=bs+8;r<=bs+10;r++)fill(r,6,11,ch)}
  if(o.tabard){for(let r=bs+1;r<=bs+7;r++)fill(r,7,10,o.tabard)}
  const tool=o.tool;
  if(tool==='hammer'){for(let r=bs-1;r<=bs+4;r++)put(r,16,'l');fill(bs-2,14,17,'g');fill(bs-1,14,17,'G');put(bs-2,14,'G');put(bs,17,'l')}
  else if(tool==='staff'){for(let r=3;r<rows.length-1;r++)put(r,16,'l');put(1,16,'c');fill(2,15,17,'c');put(2,16,'w');put(3,16,'c');put(4,15,'l');put(4,17,'l');put(bs+3,16,'l')}
  else if(tool==='sack'){fill(bs+5,1,3,'b');fill(bs+6,0,3,'b');fill(bs+7,0,3,'B');put(bs+5,2,'y');put(bs+6,1,'y')}
  else if(tool==='basket'){fill(bs+5,14,17,'b');fill(bs+6,14,17,'B');fill(bs+4,14,17,'.');put(bs+4,14,'l');put(bs+4,17,'l');fill(bs+3,15,16,'l');put(bs+5,15,'o');put(bs+5,16,'r')}
  else if(tool==='spear'){for(let r=1;r<rows.length-1;r++)put(r,16,'l');put(0,16,'G');put(1,16,'G');put(2,15,'g');put(2,17,'g');put(bs+4,16,'l')}
  else if(tool==='mug'){fill(bs+4,15,17,'W');fill(bs+5,15,17,'y');put(bs+5,17,'W')}
  return rows.map(r=>r.join(''));
}

function genFloor(){
  map=new Uint8Array(MW*MH);rooms=[];
  const bossFloor=mode==='dungeon'&&floorN%3===0;
  const target=7+Math.min(3,floorN>>1);let tries=0,bossRoom=null;
  if(bossFloor){
    const w=ri(14,16),h=ri(12,14),x=ri(2,MW-w-3),y=ri(2,MH-h-3);
    bossRoom={x,y,w,h,cx:x+(w>>1),cy:y+(h>>1),alive:0,total:0,cleared:false,visited:false,elite:false,boss:true};rooms.push(bossRoom);
  }
  while(rooms.length<target&&tries<3000){
    tries++;
    const w=ri(6,12),h=ri(6,11),x=ri(2,MW-w-3),y=ri(2,MH-h-3);
    if(rooms.some(o=>x<o.x+o.w+3&&x+w+3>o.x&&y<o.y+o.h+3&&y+h+3>o.y))continue;
    rooms.push({x,y,w,h,cx:x+(w>>1),cy:y+(h>>1),alive:0,total:0,cleared:false,visited:false,elite:false});
  }
  for(const r of rooms)for(let y=r.y;y<r.y+r.h;y++)for(let x=r.x;x<r.x+r.w;x++)map[y*MW+x]=1;
  const set=(x,y)=>{if(x>0&&y>0&&x<MW-1&&y<MH-1)map[y*MW+x]=1};
  const corridor=(a,b)=>{
    const h=(x0,x1,yy)=>{for(let x=Math.min(x0,x1);x<=Math.max(x0,x1);x++){set(x,yy);set(x,yy+1)}};
    const v=(y0,y1,xx)=>{for(let y=Math.min(y0,y1);y<=Math.max(y0,y1);y++){set(xx,y);set(xx+1,y)}};
    if(rnd()<.5){h(a.cx,b.cx,a.cy);v(a.cy,b.cy,b.cx)}else{v(a.cy,b.cy,a.cx);h(a.cx,b.cx,b.cy)}
  };
  const left=rooms.filter(r=>r!==bossRoom),chain=[left.splice(ri(0,left.length-1),1)[0]];
  while(left.length){
    const a=chain[chain.length-1];let bi=0,bd=1e9;
    left.forEach((r,i)=>{const d=Math.abs(r.cx-a.cx)+Math.abs(r.cy-a.cy);if(d<bd){bd=d;bi=i}});
    chain.push(left.splice(bi,1)[0]);
  }
  if(bossRoom)chain.push(bossRoom);

function computeFlow(){
  const sx=Math.floor(P.x/TILE),sy=Math.floor(P.y/TILE);
  flow.fill(-1);
  const q=[sy*MW+sx];flow[q[0]]=0;
  for(let h=0;h<q.length;h++){
    const c=q[h],cx=c%MW,cy=(c/MW)|0,d=flow[c]+1;
    for(const [dx,dy] of N4){
      const nx=cx+dx,ny=cy+dy;if(nx<0||ny<0||nx>=MW||ny>=MH)continue;
      const ni=ny*MW+nx;if(flow[ni]!==-1||map[ni]===0)continue;
      flow[ni]=d;q.push(ni);
    }
  }
}
function steer(e){
  const dx=P.x-e.x,dy=P.y-e.y,d=hyp(dx,dy)||1;
  if(d<26||los(e.x,e.y,P.x,P.y))return{x:dx/d,y:dy/d};
  const tx=Math.floor(e.x/TILE),ty=Math.floor(e.y/TILE);
  let best=flow[ty*MW+tx],bx=-1,by=-1;
  if(best<0)return{x:dx/d,y:dy/d};
  for(const [ax,ay] of N8){
    const nx=tx+ax,ny=ty+ay;if(nx<0||ny<0||nx>=MW||ny>=MH)continue;
    const v=flow[ny*MW+nx];if(v<0||v>=best)continue;
    if(ax&&ay&&(map[ty*MW+nx]===0||map[ny*MW+tx]===0))continue;
    best=v;bx=nx;by=ny;
  }
  if(bx<0)return{x:dx/d,y:dy/d};
  const cx=bx*TILE+8-e.x,cy=by*TILE+8-e.y,m=hyp(cx,cy)||1;
  return{x:cx/m,y:cy/m};
}

  return g;
}
function spotFor(w,h){
  const g=occ();
  for(let y=0;y<=GH-h;y++)for(let x=0;x<=GW-w;x++){
    let ok=true;
    for(let j=y;j<y+h&&ok;j++)for(let i=x;i<x+w;i++)if(g[j*GW+i]>=0){ok=false;break}
    if(ok)return[x,y];

function buildOffer(){

  if(free)for(const id of Object.keys(SK))if(!owned.includes(id))cand.push({type:'new',id});
  for(const s of P.skills)if(s.lv<3)cand.push({type:'up',id:s.id});
  shuffle(cand);
  const pas=shuffle(PASS.slice()).map(p=>({type:'pas',id:p.id}));
  const out=[],need=free?2:1;
  while(out.length<need&&cand.length)out.push(cand.pop());
  while(out.length<3&&pas.length)out.push(pas.pop());
  while(out.length<3&&cand.length)out.push(cand.pop());
  return shuffle(out);
}

/* ---------- arena: one big hall, endless waves, a guardian every fifth wave, a new world every five ---------- */
function genArena(){
  map=new Uint8Array(MW*MH);
  const w=30,h=26,x=(MW-w)>>1,y=(MH-h)>>1;
  const r={x,y,w,h,cx:x+(w>>1),cy:y+(h>>1),alive:0,total:0,cleared:true,visited:true,elite:false,arena:true};
  rooms=[r];
  for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++)map[j*MW+i]=1;
  const cut=5;
  for(let j=0;j<cut;j++)for(let i=0;i<cut-1-j;i++){
    map[(y+j)*MW+x+i]=0;map[(y+j)*MW+x+w-1-i]=0;map[(y+h-1-j)*MW+x+i]=0;map[(y+h-1-j)*MW+x+w-1-i]=0;
  }
  for(const [dx,dy] of [[-8,-6],[7,-6],[-8,5],[7,5],[-1,-9],[-1,8]])for(let b=0;b<2;b++)for(let a=0;a<2;a++)map[(r.cy+dy+b)*MW+r.cx+dx+a]=0;
  const far=(tx,ty)=>hyp(tx-r.cx,ty-r.cy)>5;
  for(let k=0;k<3+(arenaS?Math.min(3,arenaS.stage-1):0);k++){
    const tx=ri(r.x+3,r.x+r.w-5),ty=ri(r.y+3,r.y+r.h-5);
    if(!far(tx,ty))continue;
    for(let dy=0;dy<2;dy++)for(let dx=0;dx<2;dx++)if(map[(ty+dy)*MW+tx+dx]===1)map[(ty+dy)*MW+tx+dx]=2;
  }
  if(rnd()<.7){
    const cx=ri(r.x+4,r.x+r.w-5),cy=ri(r.y+4,r.y+r.h-5),rad=1.5+rnd()*1.3;
    if(far(cx,cy))for(let j=cy-3;j<=cy+3;j++)for(let i=cx-3;i<=cx+3;i++)if(hyp(i-cx,j-cy)<=rad&&map[j*MW+i]===1)map[j*MW+i]=3;
  }
  stairs={tx:0,ty:0};
  return r;
}
function arenaStage(){
  const nb=DUNG[(arenaS.stage-1)%NBIO],changed=nb!==biome;biome=nb;

const arenaCost=k=>{const T=ET[k];return T.elite?8:Math.max(1,Math.min(4,Math.round(T.hp/24)))*(T.swarm?Math.max(1,Math.round(T.swarm*.6)):1)};

    <button class="ghost" type="button" data-a="closeov">Закрыть</button></div>`);
  ov.scrollTop=keep;
}
function invAction(a,d){
  invMsg='';
  if(a==='bit'){
    const i=+d.i,b=P.bag[i];if(!b)return;
    if(!held){P.bag.splice(i,1);held=b.id}
    else{const r=placeAt(held,b.x,b.y);if(r)held=r.swap;else invMsg='Не помещается.'}
  }else if(a==='cell'){
    if(held){const r=placeAt(held,+d.x,+d.y);if(r)held=r.swap;else invMsg='Не помещается.'}
  }else if(a==='slot'){
    const k=d.k;
    if(held){
      if(!slotOk(held,k))invMsg='Этот предмет сюда не подходит.';
      else{const old=P.eq[k];if(old)applyGear(old,-1);P.eq[k]=held;applyGear(held,1);held=old||null;sfx('pick')}
    }else if(P.eq[k]){held=P.eq[k];applyGear(held,-1);delete P.eq[k]}
  }else if(held){
    if(a==='gwear'){held=equipAuto(held);if(held&&bagAdd(held))held=null}
    else if(a==='gstow'){if(bagAdd(held))held=null;else invMsg='В рюкзаке нет места.'}
    else if(a==='gsell'){P.gold+=sellPrice(held);held=null;sfx('coin')}
  }
  renderInv();
}
function openMap(){
  state='map';resetInput();explore();
  showOv(`<div class="pane"><h2>${town?'Деревня':mode==='arena'?'Арена':'Карта этажа '+floorN}</h2><p class="sub" style="font-size:18px">${BIOMES[biome].n}</p><canvas id="bigmap" width="${MW*10}" height="${MH*10}"></canvas>
    <p class="legend"><span class="lg w">Ты</span>${town?'<span class="lg y">Жители</span><span class="lg p">Врата</span>':'<span class="lg r">Враги</span><span class="lg y">Лестница</span><span class="lg c">Алмаз</span>'}</p>
    <button class="cta" type="button" data-a="closeov">Закрыть</button></div>`);
  drawBigMap($('bigmap'));
}

function frame(ts){
  requestAnimationFrame(frame);
  const raw=(ts-last)||16.7,dt=Math.min(.05,raw/1000||0);last=ts;
  if(raw<250){fpsAvg+=(raw-fpsAvg)*.04;if(state==='play'&&!lowQ){if(fpsAvg>31)fpsLow+=raw/1000;else fpsLow=Math.max(0,fpsLow-raw/1000)}if(fpsLow>3)lowQ=true}
  pollPad(dt);updMouse(dt);
  if(state==='play'){saveT+=dt;if(saveT>=5){saveT=0;saveGame()}}
  if(state==='play'){if(hitstop>0)hitstop-=dt;else update(dt)}
  else if(state==='dead'){updFx(dt);shake=Math.max(0,shake-dt*22);hurtFx=Math.max(0,hurtFx-dt)}
  uiTick();draw();
}
